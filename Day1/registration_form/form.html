<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- Creating a header for the form -->
    <!-- We are using name attribute as the identifier for form data-->
    <!-- "placeholder" is sample value inside an input field.-->
    <!-- "required is used to make the fields mandatory."-->
    <h2>Employee registration form</h2>
    <form>
        <label for="fname">First Name</label> <!-- label for textfield -->
        <input type="text" id="fname" name="fname" placeholder="swati" required><br> <!-- textfield creation -->

        <label for="email_id">Emain Address</label>
        <input type="email" id="email_id" name="email" placeholder="swati@gmail.com" required><br>

        <label for="pwd">Password</label>
        <input type="password" id="pwd" name="password" placeholder="Enter your password" required><br>

        <label for="age">Employee Age</label>
        <input type="number" id="age" name="employeeAge" placeholder="Select age"><br>

        <label for="dob">Date Of Birth</label>
        <input type="date" id="dob" name="birthDate"><br>

        <p>Gender</p>

        <input type="radio" id="male" name="gender">
        <label for="male">Male</label>
        
        <input type="radio" id="female" name="gender">
        <label for="female">Female</label>
        
        <input type="radio" id="other" name="gender">
        <label for="other">Other</label><br>

        <p>Technical Skills</p>

        <input type="checkbox" id="java" name="languages">
        <label for="java">Java</label><br>
        
        <input type="checkbox" id="python" name="languages">
        <label for="python">Python</label><br>
        
        <input type="checkbox" id="mysql" name="languages">
        <label for="mysql">Mysql</label><br>

        <input type="checkbox" id="html" name="languages">
        <label for="html">HTML</label><br>

        <p><label for="comments">Comments</label></p>
        <textarea id="comments" name="comments" rows="4" placeholder="Write your feedback"></textarea>

        <p><label for="country">Select a Country</label></p>
        <select name="country" id="country">
            <option value="india">India</option>
            <option value="usa">USA</option>
            <option value="uk">UK</option>
        </select><br><br>


        <button type="submit">Submit Form</button>
        <button type="reset">Reset Form</button>


    </form>
    
</body>
</html>
